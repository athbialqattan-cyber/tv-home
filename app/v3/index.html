<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>واجهتي</title>
<style>
:root{--bg:#0b1220;--fg:#fff;--accent:#5b8cff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--fg);font-family:sans-serif}
#clock{position:absolute;top:60px;left:90px;direction:ltr;font-size:120px;font-weight:700}
#date{position:absolute;top:200px;left:94px;direction:ltr;font-size:34px;opacity:.8}
#prayer{position:absolute;top:70px;right:90px;font-size:38px;text-align:right}
#shelf{position:absolute;bottom:170px;right:90px;left:90px;display:flex;gap:40px;flex-direction:row}
.app{width:300px;height:190px;border-radius:24px;background:rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;border:4px solid transparent}
.app img{width:90px;height:90px;object-fit:contain;margin-bottom:12px}
.app.focus{border-color:var(--accent);background:rgba(255,255,255,.22)}
#status{position:absolute;bottom:40px;right:90px;left:90px;font-size:24px;opacity:.7;direction:ltr}
</style>
</head>
<body>
<div id="clock">--:--</div><div id="date"></div>
<div id="prayer">…</div>
<div id="shelf"></div>
<div id="status"></div>
<script src="main.js"></script>
</body>
</html>
